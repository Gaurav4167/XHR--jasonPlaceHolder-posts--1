<body>
    <div class="container">
        <div class="row">
            <div class="col-6 offset-3 mt-5">

                <div class="card">
                    <div class="card-header" id="form-heading">
                        <div class="d-flex justify-content-center">
                            <h3 id="add-heading"><b>Add Post</b></h3>
                            <h3 id="update-heading" class="d-none"><b>Update Post</b></h3>
                        </div>
                    </div>
                    <div class="card-body">
                        <form id="form">
                            <label for="titleControl"><b>Title</b></label>
                            <input id="titleControl" class="form-control mb-4" type="text" placeholder="Enter Title" required>

                            <label for="bodyControl"><b>Body</b></label>
                            <input id="bodyControl" class="form-control mb-4" type="text"
                                placeholder="Enter Body(Description)" required>

                            <label for="userId"><b>User-Id</b></label>
                            <select id="userId" class="form-control mb-4" value="">
                                <option value="1" id="">1</option>
                                <option value="2" id="">2</option>
                                <option value="3" id="">3</option>
                                <option value="4" id="">4</option>
                                <option value="5" id="">5</option>
                                <option value="6" id="">6</option>
                                <option value="7" id="">7</option>
                                <option value="8" id="">8</option>
                                <option value="9" id="">9</option>
                                <option value="10" id="">10</option>
                            </select>

                            <div class="d-flex justify-content-between">
                                <div>
                                    <button id="addBtn" class="btn border shadow "><b>Add</b></button>
                                    <button type="button" id="updateBtn"
                                        class="btn border shadow d-none"><b>Update</b></button>
                                </div>
                                <button type="button" id="cancelBtn" class="btn border shadow "><b>Cancel</b></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
